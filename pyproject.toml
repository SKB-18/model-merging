[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-merging"
version = "0.1.0"
description = "Model Merging & Distillation Lab: SLERP, TIES-Merging, and DARE"
authors = [{ name = "SKB-18" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
